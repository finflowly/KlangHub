<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KlangHub</title>

  <!--
    KlangHub — Cast Web Receiver: the stage
    ================================================================================================
    What a television shows while KlangHub streams to it. Registered in the Cast Developer Console as
    a Custom Receiver; the application id it hands back goes into KlangHub under
    Einstellungen → Cast-Empfänger. Hosted from this repository via GitHub Pages, which is why the
    whole thing is one self-contained file plus four images: no build step, no dependencies.

    The idea in one sentence: the television is not a status display, it is the stage the listening
    happens on. Cover large, everything else quiet, the colour taken from the record itself, and
    motion so slow it is felt rather than seen.

    What is deliberately NOT here, and why:
      - no visualiser bars. The audio arrives at the built-in player; there is no reliable spectrum
        to read from it, and a fake one is a toy. Motion that reacts to sound comes later, from
        analysis Windows sends over the custom namespace (stage "Pulse").
      - no controls, no progress scrubber, no "Try saying…". Nobody should reach for a remote to
        make this screen stop being in the way.
      - no heavy effects. A Chromecast stick has a small GPU; one blurred layer and two slow
        transforms is the budget, and staying inside it is why this holds 60 Hz on cheap hardware.

    The audio is still played by the built-in CAF player - queue, gapless, voice and the hardware
    remote all keep working. Only the picture is ours.

    This file also runs in an ordinary browser: with no Cast SDK present it shows a demonstration
    track, which is how the design is reviewed without a television in the room.
  -->

  <!--
    No subresource integrity hash on purpose: this is Google's own Cast SDK, served from gstatic and
    updated by Google under a stable v3 URL. Pinning a hash would break every receiver the moment they
    ship a patch - and the script is not optional, the device cannot run a receiver without it.
  -->
  <script type="text/javascript"
          src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Inter+Tight:wght@400;500&display=swap">

  <style>
    :root {
      /* True black, not a tinted near-black: on an OLED panel these pixels are genuinely off, and
         the cover is supposed to be the only light in the room. */
      --void: #000000;
      --ivory: #F3ECDD;
      --slate: #8A9AA6;
      --amber: #E8B65A;

      /* Taken from the cover at run time. The values here are what a record with no readable colour
         falls back to - a deep warm neutral, never a stock purple gradient. */
      --glow: #2A2118;
      --glow-soft: #1A1611;
      --accent: #C9BFAE;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: var(--void);
      color: var(--ivory);
      overflow: hidden;
      font-family: "Inter Tight", "Segoe UI", system-ui, sans-serif;
      /* TV panels overscan; nothing important may sit in the outer 3%. */
      --safe-x: 6.5vw;
      --safe-y: 6vh;
    }

    /* The built-in player still does the work; it is simply not what anyone looks at. Audio has no
       picture, so the element is kept out of sight rather than removed - removing it would take the
       playback machinery with it. */
    cast-media-player { position: absolute; left: -9999px; width: 1px; height: 1px; }

    /* ---------------------------------------------------------------- background */

    /* The cover again, vast and out of focus, tinted by its own palette. One blurred layer, held
       still enough that a cheap stick never has to redraw it - the slow scale is a compositor
       transform, not a repaint. */
    #wash {
      position: absolute;
      inset: -12%;
      background-size: cover;
      background-position: center;
      filter: blur(90px) saturate(140%) brightness(.42);
      opacity: 0;
      transform: scale(1.06);
      transition: opacity 1.6s ease, background-image 0s;
      animation: drift 90s ease-in-out infinite alternate;
      will-change: transform;
    }
    body.has-cover #wash { opacity: 1; }

    @keyframes drift {
      from { transform: scale(1.06) translate3d(0, 0, 0); }
      to   { transform: scale(1.14) translate3d(-1.2%, -1%, 0); }
    }

    /* Two washes of the record's own colour, and a vignette so the corners of a large panel fall
       away instead of glowing. */
    #veil {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(58% 70% at 22% 46%, color-mix(in srgb, var(--glow) 55%, transparent) 0%, transparent 70%),
        radial-gradient(70% 90% at 88% 88%, color-mix(in srgb, var(--glow-soft) 70%, transparent) 0%, transparent 65%),
        radial-gradient(120% 120% at 50% 50%, transparent 42%, rgba(0,0,0,.72) 100%);
      transition: background 1.6s ease;
    }

    /* ---------------------------------------------------------------- stage */

    #stage {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: auto 1fr;
      align-content: center;
      align-items: center;
      gap: 6vw;
      padding: var(--safe-y) var(--safe-x);
    }

    #art {
      position: relative;
      width: 60vh;
      height: 60vh;
      flex: none;
      border-radius: .8vh;
      /* The cover is the light source: it sits above its own soft shadow rather than in a frame. */
      box-shadow:
        0 3vh 7vh rgba(0, 0, 0, .65),
        0 0 14vh color-mix(in srgb, var(--accent) 18%, transparent);
      overflow: hidden;
      animation: breathe 26s ease-in-out infinite alternate;
      transition: opacity .9s ease;
      will-change: transform;
    }
    #art img {
      width: 100%;
      height: 100%;
      /* Never distort a cover. A square crop of a square picture is a no-op; anything else keeps its
         proportions and loses a sliver rather than being squashed. */
      object-fit: cover;
      display: block;
    }
    /* A record with no picture at all: the brand's ring band, drawn rather than fetched. */
    #art.empty { box-shadow: none; background: transparent; }
    #art.empty img { display: none; }

    @keyframes breathe {
      from { transform: translate3d(0, -.5vh, 0) scale(1); }
      to   { transform: translate3d(0, .5vh, 0) scale(1.012); }
    }

    #rings { position: absolute; inset: 0; display: none; }
    #art.empty #rings { display: block; }
    #rings i {
      position: absolute; inset: 0; margin: auto;
      border: 1px solid rgba(232, 182, 90, .13);
      border-radius: 50%;
    }
    #rings i:nth-child(1) { width: 12%; height: 12%; background: var(--amber); border: none;
                            box-shadow: 0 0 5vh rgba(232, 182, 90, .4); }
    #rings i:nth-child(2) { width: 26%; height: 26%; border-color: rgba(232, 182, 90, .55); }
    #rings i:nth-child(3) { width: 44%; height: 44%; border-color: rgba(232, 182, 90, .26); }
    #rings i:nth-child(4) { width: 64%; height: 64%; }
    #rings i:nth-child(5) { width: 84%; height: 84%; }
    #rings i:nth-child(6) { width: 100%; height: 100%; }

    /* ---------------------------------------------------------------- words */

    #words { min-width: 0; }

    #title {
      font-family: "Fraunces", Georgia, serif;
      font-variation-settings: "opsz" 144, "SOFT" 0, "WONK" 0;
      font-weight: 300;
      font-size: clamp(3rem, 8.4vh, 9rem);
      line-height: 1.04;
      letter-spacing: -.015em;
      margin: 0;
      /* Two lines for a long title, then it gives up gracefully rather than pushing the artist off
         the bottom of a 16:9 panel. */
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    #artist {
      font-family: "Fraunces", Georgia, serif;
      font-variation-settings: "opsz" 60;
      font-weight: 300;
      font-size: clamp(1.3rem, 3.4vh, 3rem);
      line-height: 1.2;
      margin: 1.6vh 0 0;
      color: color-mix(in srgb, var(--accent) 82%, var(--ivory));
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: color 1.6s ease;
    }

    #album {
      font-size: clamp(.8rem, 1.75vh, 1.4rem);
      font-weight: 400;
      color: var(--slate);
      margin: 2.4vh 0 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      opacity: .85;
    }

    /* The progress line: information, not a video recorder. One hairline, one dot, two times. */
    /* Deliberately shorter than the words above it. A line stretched across the panel reads as a
       transport control somebody is meant to operate; this one is only telling you where you are. */
    #progress { margin-top: 5vh; max-width: 32vw; display: none; }
    body.has-progress #progress { display: block; }

    #track {
      position: relative;
      height: 1px;
      background: rgba(243, 236, 221, .16);
    }
    #elapsed {
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 0;
      background: color-mix(in srgb, var(--accent) 70%, var(--ivory));
      transition: width 1s linear;
    }
    #head {
      position: absolute;
      top: 50%;
      width: .8vh; height: .8vh;
      margin: -.4vh 0 0 -.4vh;
      border-radius: 50%;
      background: var(--ivory);
      left: 0;
      transition: left 1s linear;
    }
    #times {
      display: flex;
      justify-content: space-between;
      margin-top: 1.6vh;
      font-size: clamp(.7rem, 1.5vh, 1.2rem);
      color: var(--slate);
      font-variant-numeric: tabular-nums;
    }

    /* ---------------------------------------------------------------- edges */

    /* Quality mark, top right. Present only when the sender actually knows these facts - an invented
       "FLAC" would be worse than saying nothing. */
    #quality {
      position: absolute;
      top: var(--safe-y);
      right: var(--safe-x);
      font-size: clamp(.7rem, 1.5vh, 1.15rem);
      letter-spacing: .04em;
      color: var(--slate);
      opacity: .7;
      display: none;
    }
    body.has-quality #quality { display: block; }

    #zone {
      position: absolute;
      left: var(--safe-x);
      bottom: var(--safe-y);
      font-size: clamp(.7rem, 1.5vh, 1.15rem);
      color: var(--slate);
      opacity: .55;
    }

    #wordmark {
      position: absolute;
      right: var(--safe-x);
      bottom: var(--safe-y);
      font-family: "Fraunces", Georgia, serif;
      font-variation-settings: "opsz" 40;
      font-weight: 400;
      font-size: clamp(.85rem, 1.9vh, 1.5rem);
      color: var(--amber);
      opacity: .42;
    }

    /* The clock only appears while the music is held, and only then. */
    #clock {
      position: absolute;
      right: var(--safe-x);
      top: 50%;
      transform: translateY(-50%);
      font-family: "Fraunces", Georgia, serif;
      font-variation-settings: "opsz" 144;
      font-weight: 300;
      font-size: 11vh;
      color: var(--ivory);
      opacity: 0;
      transition: opacity 1.2s ease;
      font-variant-numeric: tabular-nums;
      pointer-events: none;
    }
    body.paused #clock { opacity: .22; }

    /* Held, not stopped: the picture stays, the room simply dims. The edge markings dim with it -
       they sit outside the stage in the markup but they are in the same room. */
    body.paused #stage,
    body.paused #quality,
    body.paused #zone,
    body.paused #wordmark { filter: brightness(.5); }
    body.paused #wash { filter: blur(90px) saturate(120%) brightness(.24); }
    #stage, #quality, #zone, #wordmark { transition: filter 1.4s ease; }

    /* Nothing playing: the words go and the brand's own mark stands alone in the middle. The text
       block is removed from the grid rather than merely made transparent - left in place it keeps
       its column, and the mark ends up hanging off-centre with no visible reason. */
    body.idle #quality, body.idle #zone { opacity: 0; }
    body.idle #words { display: none; }
    body.idle #stage { grid-template-columns: 1fr; justify-items: center; }
    #quality, #zone { transition: opacity .8s ease; }
    #words { transition: opacity .8s ease; }

    /* The one moment of motion with meaning: a new piece arrives. */
    body.changing #art, body.changing #words { opacity: 0; }

    @media (prefers-reduced-motion: reduce) {
      #wash, #art { animation: none; }
    }
  </style>
</head>

<body class="idle">
  <cast-media-player></cast-media-player>

  <div id="wash"></div>
  <div id="veil"></div>

  <div id="stage">
    <div id="art" class="empty">
      <img id="cover" alt="">
      <div id="rings"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    </div>

    <div id="words">
      <h1 id="title"></h1>
      <p id="artist"></p>
      <p id="album"></p>

      <div id="progress">
        <div id="track"><div id="elapsed"></div><div id="head"></div></div>
        <div id="times"><span id="now">0:00</span><span id="total"></span></div>
      </div>
    </div>
  </div>

  <div id="quality"></div>
  <div id="zone"></div>
  <div id="wordmark">KlangHub</div>
  <div id="clock"></div>

  <script>
  (function () {
    'use strict';

    var NAMESPACE = 'urn:x-cast:de.klanghub.stage';

    var el = {
      body: document.body,
      wash: document.getElementById('wash'),
      art: document.getElementById('art'),
      cover: document.getElementById('cover'),
      title: document.getElementById('title'),
      artist: document.getElementById('artist'),
      album: document.getElementById('album'),
      quality: document.getElementById('quality'),
      zone: document.getElementById('zone'),
      clock: document.getElementById('clock'),
      elapsed: document.getElementById('elapsed'),
      head: document.getElementById('head'),
      now: document.getElementById('now'),
      total: document.getElementById('total')
    };

    // What is on screen. Kept here rather than read back out of the DOM so that a partial update -
    // the artist arriving two seconds after the title - can be merged instead of blanking the rest.
    var shown = { title: '', artist: '', album: '', cover: '', quality: '', zone: '' };
    var duration = 0, position = 0, positionAt = 0, playing = false;

    /* ------------------------------------------------------------------ colour */

    // The record gives the room its colour. Averaging the whole cover yields mud, so this takes the
    // most saturated pixels it can find and darkens them hard: the wash behind a stage is meant to
    // be a suggestion of the record, never a lit surface competing with it.
    function paletteFrom(img) {
      try {
        var size = 36;
        var canvas = document.createElement('canvas');
        canvas.width = canvas.height = size;
        var ctx = canvas.getContext('2d', { willReadFrequently: true });
        ctx.drawImage(img, 0, 0, size, size);
        var data = ctx.getImageData(0, 0, size, size).data;

        var best = null, bestScore = -1, sum = [0, 0, 0], n = 0;
        for (var i = 0; i < data.length; i += 4) {
          var r = data[i], g = data[i + 1], b = data[i + 2];
          if (data[i + 3] < 200) continue;
          sum[0] += r; sum[1] += g; sum[2] += b; n++;

          var max = Math.max(r, g, b), min = Math.min(r, g, b);
          var chroma = max - min;
          // Favour colour that is actually coloured and not already black: a score of chroma times
          // mid-brightness picks the record's hue rather than its darkest corner.
          var score = chroma * (1 - Math.abs((max + min) / 2 / 255 - 0.55));
          if (score > bestScore) { bestScore = score; best = [r, g, b]; }
        }
        if (!n) return null;

        var average = [sum[0] / n, sum[1] / n, sum[2] / n];
        // A cover with no colour in it at all (a black-and-white sleeve) keeps its own grey rather
        // than being tinted something it is not.
        var hue = bestScore > 12 ? best : average;
        return {
          glow: rgb(scale(hue, .30)),
          soft: rgb(scale(average, .17)),
          accent: rgb(lift(hue))
        };
      } catch (e) {
        // A cover served without the cross-origin header taints the canvas and the read throws. The
        // stage simply keeps its warm neutral - it must never go blank over a colour.
        return null;
      }
    }

    function scale(c, f) { return [c[0] * f, c[1] * f, c[2] * f]; }

    // Pull a colour up to something readable as text without letting it turn neon.
    function lift(c) {
      var max = Math.max(c[0], c[1], c[2]) || 1;
      var f = Math.min(2.6, 205 / max);
      return [Math.min(255, c[0] * f), Math.min(255, c[1] * f), Math.min(255, c[2] * f)];
    }

    function rgb(c) {
      return 'rgb(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ')';
    }

    function applyPalette(p) {
      var root = document.documentElement.style;
      if (!p) {
        root.setProperty('--glow', '#2A2118');
        root.setProperty('--glow-soft', '#1A1611');
        root.setProperty('--accent', '#C9BFAE');
        return;
      }
      root.setProperty('--glow', p.glow);
      root.setProperty('--glow-soft', p.soft);
      root.setProperty('--accent', p.accent);
    }

    /* ------------------------------------------------------------------ painting */

    // Counts the cover requests. A picture arrives whenever the network feels like it, and by then the
    // track may have moved on or the music may have stopped - without this the finished download of a
    // cover nobody asked for any more puts the previous record back on screen.
    var coverRequest = 0;

    function setCover(url) {
      if (url === shown.cover) return;
      shown.cover = url || '';

      var mine = ++coverRequest;

      if (!url) {
        el.cover.removeAttribute('src');
        el.wash.style.backgroundImage = '';
        el.art.classList.add('empty');
        el.body.classList.remove('has-cover');
        applyPalette(null);
        return;
      }

      var img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = function () {
        if (mine !== coverRequest) return;
        el.cover.src = url;
        el.wash.style.backgroundImage = 'url("' + url + '")';
        el.art.classList.remove('empty');
        el.body.classList.add('has-cover');
        applyPalette(paletteFrom(img));
      };
      img.onerror = function () {
        if (mine !== coverRequest) return;
        // The picture did not arrive. The words are what matter; the stage carries on without it.
        el.art.classList.add('empty');
        el.body.classList.remove('has-cover');
        applyPalette(null);
      };
      img.src = url;
    }

    function text(node, value) {
      var next = value || '';
      if (node.textContent !== next) node.textContent = next;
      return next;
    }

    // Merge, never replace: a field that arrives empty leaves what was already known standing. This
    // is the same rule the sender's cascade follows, and it is what keeps placeholders from
    // flickering on a four-metre screen while sources answer at their own pace.
    function render(update, isNewTrack) {
      if (isNewTrack) {
        shown = { title: '', artist: '', album: '', cover: '', quality: '', zone: shown.zone };
        // The clock restarts with the piece. Without stamping the moment as well, the line would sit
        // at zero until the next position message arrived - visibly stuck under music that is playing.
        duration = 0; position = 0; positionAt = Date.now();
      }

      ['title', 'artist', 'album', 'quality', 'zone'].forEach(function (key) {
        if (update[key]) shown[key] = update[key];
      });
      if (update.cover) shown.cover = shown.cover;

      text(el.title, shown.title || 'KlangHub');
      text(el.artist, shown.artist);
      text(el.album, shown.album);
      text(el.quality, shown.quality);
      text(el.zone, shown.zone);

      el.body.classList.toggle('has-quality', !!shown.quality);
      el.body.classList.remove('idle');

      if (update.cover !== undefined) setCover(update.cover);

      if (typeof update.duration === 'number') duration = update.duration;
      if (typeof update.position === 'number') { position = update.position; positionAt = Date.now(); }
      el.body.classList.toggle('has-progress', duration > 0);
    }

    // A new piece is the one cut this screen is allowed to make, and even that is a breath: out over
    // half a second, in over the same. A hard swap reads like a slideshow.
    function change(update) {
      el.body.classList.add('changing');
      setTimeout(function () {
        render(update, true);
        el.body.classList.remove('changing');
      }, 520);
    }

    /* ------------------------------------------------------------------ time */

    function clock(seconds) {
      if (!(seconds >= 0)) return '';
      var s = Math.floor(seconds % 60), m = Math.floor(seconds / 60) % 60, h = Math.floor(seconds / 3600);
      var mm = h ? (m < 10 ? '0' + m : '' + m) : '' + m;
      return (h ? h + ':' : '') + mm + ':' + (s < 10 ? '0' + s : s);
    }

    function tick() {
      if (duration > 0) {
        var at = position + (playing ? (Date.now() - positionAt) / 1000 : 0);
        if (at > duration) at = duration;
        var pct = (at / duration) * 100;
        el.elapsed.style.width = pct + '%';
        el.head.style.left = pct + '%';
        text(el.now, clock(at));
        text(el.total, clock(duration));
      }

      var d = new Date();
      text(el.clock, d.getHours() + ':' + (d.getMinutes() < 10 ? '0' : '') + d.getMinutes());
    }
    setInterval(tick, 1000);
    tick();

    /* ------------------------------------------------------------------ cast */

    function fromMedia(media) {
      var m = (media && media.metadata) || {};
      var images = m.images || [];
      return {
        title: m.title || '',
        artist: m.artist || '',
        album: m.albumName || '',
        cover: images.length ? images[0].url : '',
        quality: describeFormat(media && media.contentType)
      };
    }

    function describeFormat(contentType) {
      if (!contentType) return '';
      if (contentType.indexOf('mpeg') >= 0) return 'MP3';
      if (contentType.indexOf('flac') >= 0) return 'FLAC';
      if (contentType.indexOf('wav') >= 0) return 'WAV';
      return '';
    }

    if (window.cast && window.cast.framework) {
      var context = cast.framework.CastReceiverContext.getInstance();
      var playerManager = context.getPlayerManager();

      playerManager.addEventListener(cast.framework.events.EventType.LOAD_START, function (event) {
        change(fromMedia(event.media));
      });

      playerManager.addEventListener(cast.framework.events.EventType.PLAYING, function () {
        playing = true;
        el.body.classList.remove('paused', 'idle');
      });

      playerManager.addEventListener(cast.framework.events.EventType.PAUSE, function () {
        playing = false;
        positionAt = Date.now();
        el.body.classList.add('paused');
      });

      [cast.framework.events.EventType.MEDIA_FINISHED,
       cast.framework.events.EventType.ERROR].forEach(function (type) {
        playerManager.addEventListener(type, function () {
          playing = false;
          el.body.classList.add('idle');
          el.body.classList.remove('paused');
          // The piece is over; its picture is not the room's wallpaper.
          setCover('');
        });
      });

      // The live channel back to Windows. A track change during a session arrives here rather than
      // as a fresh LOAD, because a LOAD on a loopback stream means tearing the audio down and
      // refilling the buffer - seconds of silence on every single track.
      context.addCustomMessageListener(NAMESPACE, function (event) {
        var d = event.data || {};
        if (d.type === 'track') {
          d.newTrack ? change(d) : render(d, false);
        } else if (d.type === 'position') {
          render({ position: d.position, duration: d.duration }, false);
        } else if (d.type === 'state') {
          playing = d.playing;
          el.body.classList.toggle('paused', !d.playing);
        }
      });

      var options = new cast.framework.CastReceiverOptions();
      options.customNamespaces = {};
      options.customNamespaces[NAMESPACE] = cast.framework.system.MessageType.JSON;
      // While a session is alive the screen stays ours: no ambient photos, no weather, no "Try
      // saying…". The device is free to go home once the sender stops.
      options.disableIdleTimeout = false;
      context.start(options);
    } else {
      // No Cast SDK: this is a browser, and somebody is looking at the design. Show a record.
      // ?demo=paused and ?demo=idle show the other two states, which are otherwise only reachable
      // with a television in the room.
      var demo = (location.search.match(/demo=(\w+)/) || [])[1];
      el.body.classList.remove('idle');
      playing = true;
      render({
        title: 'Teardrop',
        artist: 'Massive Attack',
        album: 'Mezzanine',
        quality: 'FLAC · 24 Bit · 96 kHz',
        zone: 'Wohnzimmer + Küche',
        cover: demoCover(),
        duration: 330,
        position: 134
      }, true);
      positionAt = Date.now();

      // The everyday case for a listener on internet radio: a title, an artist and a cover, and
      // genuinely nothing else - no album, no length, no quality mark. The stage has to look finished
      // like this, not like a screen with three things missing.
      if (demo === 'radio') {
        shown = { title: '', artist: '', album: '', cover: '', quality: '', zone: '' };
        duration = 0;
        el.body.classList.remove('has-progress', 'has-quality');
        render({
          title: 'Broken Nights',
          artist: 'Patiotic',
          zone: 'Wohnzimmer + Küche',
          cover: demoCover()
        }, true);
      }

      if (demo === 'paused') { playing = false; el.body.classList.add('paused'); }
      if (demo === 'idle') { playing = false; el.body.classList.add('idle'); setCover(''); }
      tick();
    }

    // A drawn stand-in so the browser preview has a real picture to take its colour from, without
    // shipping somebody's album art in the repository.
    function demoCover() {
      var c = document.createElement('canvas');
      c.width = c.height = 600;
      var x = c.getContext('2d');
      var g = x.createLinearGradient(0, 0, 600, 600);
      g.addColorStop(0, '#1B2A3A'); g.addColorStop(.55, '#2E4A5E'); g.addColorStop(1, '#0C1218');
      x.fillStyle = g; x.fillRect(0, 0, 600, 600);
      x.strokeStyle = 'rgba(215,190,150,.5)';
      for (var i = 1; i <= 5; i++) {
        x.lineWidth = 1.5;
        x.beginPath(); x.arc(300, 300, i * 46, 0, Math.PI * 2); x.stroke();
      }
      x.fillStyle = 'rgba(232,182,90,.9)';
      x.beginPath(); x.arc(300, 300, 22, 0, Math.PI * 2); x.fill();
      return c.toDataURL();
    }
  })();
  </script>
