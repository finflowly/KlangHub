<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KlangHub</title>

  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none';
                 script-src https://www.gstatic.com 'unsafe-inline';
                 style-src https://fonts.googleapis.com 'unsafe-inline';
                 font-src https://fonts.gstatic.com;
                 img-src http: https: data: blob:;
                 media-src http: https: blob:;
                 connect-src http: https: wss: ws:;
                 base-uri 'none';
                 form-action 'none';
                 frame-ancestors 'none'">

  <script type="text/javascript"
          src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Inter+Tight:wght@400;500&display=swap">

  <style>
    :root {
      --void: #000000;
      --ivory: #F3ECDD;
      --slate: #8A9AA6;
      --amber: #E8B65A;

      --glow: #2A2118;
      --glow-soft: #1A1611;
      --accent: #C9BFAE;

      --stage-h: 720px;
      --stage-w: 1280px;

      --safe-x: calc(var(--stage-w) * 6.5 / 100);
      --safe-y: calc(var(--stage-h) * 9 / 100);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      position: fixed;
      top: 0; right: 0; bottom: 0; left: 0;
      inset: 0;
      overflow: hidden;
      background: var(--void);
      color: var(--ivory);
      font-family: "Inter Tight", "Segoe UI", system-ui, sans-serif;
    }

    cast-media-player {
      position: fixed;
      top: 0; right: 0; bottom: 0; left: 0;
      inset: 0;
      opacity: 0;
      pointer-events: none;
      z-index: 0;
      --background-color: transparent;
      --background-image: none;
      --splash-image: none;
      --splash-size: 0;
      --logo-image: none;
      --watermark-image: none;
      --playback-logo-image: none;
      --progress-color: transparent;
      --progress-bar-color: transparent;
      --theme-hue: 0;
      --font-family: "Inter Tight", sans-serif;
    }

    #wash {
      position: fixed;
      top: -12%; right: -12%; bottom: -12%; left: -12%;
      inset: -12%;
      z-index: 1;
      background-size: cover;
      background-position: center;
      filter: blur(90px) saturate(140%) brightness(.42);
      opacity: 0;
      transition: opacity 1.6s ease;
    }
    body.has-cover #wash { opacity: 1; }

    #veil {
      position: fixed;
      top: 0; right: 0; bottom: 0; left: 0;
      inset: 0;
      z-index: 2;
      background:
        radial-gradient(58% 70% at 22% 46%, rgba(42, 33, 24, .55) 0%, transparent 70%),
        radial-gradient(70% 90% at 88% 88%, rgba(26, 22, 17, .70) 0%, transparent 65%),
        radial-gradient(120% 120% at 50% 50%, transparent 42%, rgba(0,0,0,.72) 100%);
      background:
        radial-gradient(58% 70% at 22% 46%, color-mix(in srgb, var(--glow) 55%, transparent) 0%, transparent 70%),
        radial-gradient(70% 90% at 88% 88%, color-mix(in srgb, var(--glow-soft) 70%, transparent) 0%, transparent 65%),
        radial-gradient(120% 120% at 50% 50%, transparent 42%, rgba(0,0,0,.72) 100%);
      transition: background 1.6s ease;
    }

    #stage {
      position: fixed;
      top: 0;
      left: 0;
      width: var(--stage-w);
      height: var(--stage-h);
      z-index: 3;
      overflow: hidden;
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: start;
      align-content: start;
      gap: calc(var(--stage-w) * 6 / 100);
      padding: var(--safe-y) var(--safe-x);
    }

    #art {
      position: relative;
      width: calc(var(--stage-h) * 52 / 100);
      width: min(calc(var(--stage-h) * 52 / 100), calc(var(--stage-w) * 38 / 100));
      height: calc(var(--stage-h) * 52 / 100);
      height: min(calc(var(--stage-h) * 52 / 100), calc(var(--stage-w) * 38 / 100));
      border-radius: calc(var(--stage-h) * .8 / 100);
      box-shadow:
        0 calc(var(--stage-h) * 3 / 100) calc(var(--stage-h) * 7 / 100) rgba(0, 0, 0, .65),
        0 0 calc(var(--stage-h) * 14 / 100) rgba(201, 191, 174, .18);
      box-shadow:
        0 calc(var(--stage-h) * 3 / 100) calc(var(--stage-h) * 7 / 100) rgba(0, 0, 0, .65),
        0 0 calc(var(--stage-h) * 14 / 100) color-mix(in srgb, var(--accent) 18%, transparent);
      overflow: hidden;
      transition: opacity .9s ease;
    }
    #art img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      animation: breathe 26s ease-in-out infinite alternate;
      will-change: transform;
    }
    #art.empty { box-shadow: none; background: transparent; }
    #art.empty img { display: none; }

    @keyframes breathe {
      from { transform: scale(1); }
      to   { transform: scale(1.035); }
    }

    #rings { position: absolute; top: 0; right: 0; bottom: 0; left: 0; inset: 0; display: none; }
    #art.empty #rings { display: block; }
    #rings i {
      position: absolute; top: 0; right: 0; bottom: 0; left: 0; inset: 0; margin: auto;
      border: 1px solid rgba(232, 182, 90, .13);
      border-radius: 50%;
    }
    #rings i:nth-child(1) { width: 12%; height: 12%; background: var(--amber); border: none;
                            box-shadow: 0 0 calc(var(--stage-h) * 5 / 100) rgba(232, 182, 90, .4); }
    #rings i:nth-child(2) { width: 26%; height: 26%; border-color: rgba(232, 182, 90, .55); }
    #rings i:nth-child(3) { width: 44%; height: 44%; border-color: rgba(232, 182, 90, .26); }
    #rings i:nth-child(4) { width: 64%; height: 64%; }
    #rings i:nth-child(5) { width: 84%; height: 84%; }
    #rings i:nth-child(6) { width: 100%; height: 100%; }

    #words { min-width: 0; }

    #title {
      font-family: "Fraunces", Georgia, serif;
      font-variation-settings: "opsz" 72;
      font-weight: 400;
      font-size: calc(var(--stage-h) * 8.4 / 100);
      line-height: 1.04;
      min-height: 2.08em;
      letter-spacing: -.015em;
      margin: 0;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    #artist {
      font-family: "Fraunces", Georgia, serif;
      font-variation-settings: "opsz" 60;
      font-weight: 400;
      font-size: calc(var(--stage-h) * 3.4 / 100);
      line-height: 1.2;
      margin: calc(var(--stage-h) * 1.6 / 100) 0 0;
      color: #DCD3C4;
      color: color-mix(in srgb, var(--accent) 82%, var(--ivory));
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: color 1.6s ease;
    }

    #album {
      font-size: calc(var(--stage-h) * 1.75 / 100);
      font-weight: 400;
      color: var(--slate);
      margin: calc(var(--stage-h) * 2.4 / 100) 0 0;
      min-height: 1.3em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      opacity: .85;
    }

    #progress {
      margin-top: calc(var(--stage-h) * 5 / 100);
      max-width: calc(var(--stage-w) * 32 / 100);
      visibility: hidden;
      opacity: 0;
      transition: opacity .6s ease;
    }
    body.has-progress #progress { visibility: visible; opacity: 1; }

    #track {
      position: relative;
      height: 1px;
      background: rgba(243, 236, 221, .16);
    }
    #elapsed {
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 0;
      background: #DED6C8;
      background: color-mix(in srgb, var(--accent) 70%, var(--ivory));
      transition: width 1s linear;
    }
    #head {
      position: absolute;
      top: 50%;
      width: calc(var(--stage-h) * .8 / 100);
      height: calc(var(--stage-h) * .8 / 100);
      margin: calc(var(--stage-h) * -.4 / 100) 0 0 calc(var(--stage-h) * -.4 / 100);
      border-radius: 50%;
      background: var(--ivory);
      left: 0;
      transition: left 1s linear;
    }
    #times {
      display: flex;
      justify-content: space-between;
      margin-top: calc(var(--stage-h) * 1.6 / 100);
      font-size: calc(var(--stage-h) * 1.5 / 100);
      color: var(--slate);
      font-variant-numeric: tabular-nums;
    }

    #quality {
      position: fixed;
      top: var(--safe-y);
      right: var(--safe-x);
      z-index: 4;
      font-size: calc(var(--stage-h) * 1.5 / 100);
      letter-spacing: .04em;
      color: var(--slate);
      opacity: 0;
      visibility: hidden;
      transition: opacity .8s ease;
    }
    body.has-quality #quality { opacity: .7; visibility: visible; }

    #zone, #wordmark {
      position: fixed;
      top: calc(var(--stage-h) - var(--safe-y));
      transform: translateY(-100%);
      z-index: 4;
    }

    #zone {
      left: var(--safe-x);
      font-size: calc(var(--stage-h) * 1.5 / 100);
      color: var(--slate);
      opacity: .55;
    }

    #wordmark {
      right: var(--safe-x);
      text-align: right;
      font-family: "Fraunces", Georgia, serif;
      font-variation-settings: "opsz" 40;
      font-weight: 400;
      font-size: calc(var(--stage-h) * 1.9 / 100);
      color: var(--amber);
      opacity: .42;
      line-height: 1.25;
    }
    #wordmark i {
      display: block;
      font-family: "Inter Tight", "Segoe UI", system-ui, sans-serif;
      font-style: normal;
      font-size: .52em;
      letter-spacing: .22em;
      color: var(--ivory);
      opacity: .5;
      margin-top: .3em;
    }

    #clock {
      position: fixed;
      right: var(--safe-x);
      top: calc(var(--stage-h) / 2);
      transform: translateY(-50%);
      z-index: 4;
      font-family: "Fraunces", Georgia, serif;
      font-variation-settings: "opsz" 72;
      font-weight: 400;
      font-size: calc(var(--stage-h) * 11 / 100);
      color: var(--ivory);
      opacity: 0;
      transition: opacity 1.2s ease;
      font-variant-numeric: tabular-nums;
      pointer-events: none;
    }
    body.paused #clock { opacity: .22; }

    body.paused #stage,
    body.paused #quality,
    body.paused #zone,
    body.paused #wordmark { filter: brightness(.5); }
    body.paused #wash { filter: blur(90px) saturate(120%) brightness(.24); }
    #stage, #quality, #zone, #wordmark { transition: filter 1.4s ease; }

    body.idle #quality, body.idle #zone { opacity: 0; }
    body.idle #words { visibility: hidden; }
    body.idle #stage { align-content: center; justify-items: center; }
    #words { transition: opacity .8s ease; }

    body.changing #art, body.changing #words { opacity: 0; }

    @media (prefers-reduced-motion: reduce) {
      #art img { animation: none; }
    }
  </style>
</head>

<body class="idle">
  <cast-media-player></cast-media-player>

  <div id="wash"></div>
  <div id="veil"></div>

  <div id="stage">
    <div id="art" class="empty">
      <img id="cover" alt="">
      <div id="rings"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    </div>

    <div id="words">
      <h1 id="title"></h1>
      <p id="artist"></p>
      <p id="album"></p>

      <div id="progress">
        <div id="track"><div id="elapsed"></div><div id="head"></div></div>
        <div id="times"><span id="now">0:00</span><span id="total"></span></div>
      </div>
    </div>
  </div>

  <div id="quality"></div>
  <div id="zone"></div>

  <div id="wordmark">KlangHub<i>ONE MUSIC · EVERY ROOM</i></div>
  <div id="clock"></div>

  <script>
  (function () {
    'use strict';

    var NAMESPACE = 'urn:x-cast:de.klanghub.stage';

    var sessionToken = null;

    var SHORTEST_TOKEN = 8;

    function rememberToken(custom) {
      var given = custom && custom.stageToken;
      sessionToken = (typeof given === 'string' && given.length >= SHORTEST_TOKEN) ? given : null;
    }

    function fromUs(data) {
      if (!sessionToken) return true;

      var given = data && data.token;
      if (typeof given !== 'string' || given.length !== sessionToken.length) return false;

      var difference = 0;
      for (var i = 0; i < given.length; i++) difference |= given.charCodeAt(i) ^ sessionToken.charCodeAt(i);
      return difference === 0;
    }

    var el = {
      body: document.body,
      wash: document.getElementById('wash'),
      art: document.getElementById('art'),
      cover: document.getElementById('cover'),
      title: document.getElementById('title'),
      artist: document.getElementById('artist'),
      album: document.getElementById('album'),
      quality: document.getElementById('quality'),
      zone: document.getElementById('zone'),
      wordmark: document.getElementById('wordmark'),
      clock: document.getElementById('clock'),
      elapsed: document.getElementById('elapsed'),
      head: document.getElementById('head'),
      now: document.getElementById('now'),
      total: document.getElementById('total')
    };

    var shown = { title: '', artist: '', album: '', cover: '', quality: '', zone: '' };
    var duration = 0, position = 0, positionAt = 0, playing = false;

    var nowMs = (window.performance && performance.now)
      ? function () { return performance.now(); }
      : function () { return Date.now(); };

    function pinViewport() {
      var vv = window.visualViewport;
      var h = Math.min(
        (vv && vv.height) || Infinity,
        (window.screen && window.screen.height) || Infinity,
        window.innerHeight || Infinity
      );
      var w = Math.min(
        (vv && vv.width) || Infinity,
        (window.screen && window.screen.width) || Infinity,
        window.innerWidth || Infinity
      );

      if (!isFinite(h) || h < 240) h = 720;
      if (!isFinite(w) || w < 320) w = 1280;

      var root = document.documentElement.style;
      root.setProperty('--stage-h', Math.round(h) + 'px');
      root.setProperty('--stage-w', Math.round(w) + 'px');
    }

    var pinPending = 0;

    function pinSoon() {
      if (pinPending) return;
      pinPending = setTimeout(function () { pinPending = 0; pinViewport(); }, 500);
    }

    pinViewport();
    window.addEventListener('resize', pinSoon);
    if (window.visualViewport) window.visualViewport.addEventListener('resize', pinSoon);
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) pinViewport();
    });

    function paletteFrom(img) {
      try {
        var size = 36;
        var canvas = document.createElement('canvas');
        canvas.width = canvas.height = size;
        var ctx = canvas.getContext('2d', { willReadFrequently: true });
        ctx.drawImage(img, 0, 0, size, size);
        var data = ctx.getImageData(0, 0, size, size).data;

        var best = null, bestScore = -1, sum = [0, 0, 0], n = 0;
        for (var i = 0; i < data.length; i += 4) {
          var r = data[i], g = data[i + 1], b = data[i + 2];
          if (data[i + 3] < 200) continue;
          sum[0] += r; sum[1] += g; sum[2] += b; n++;

          var max = Math.max(r, g, b), min = Math.min(r, g, b);
          var chroma = max - min;
          var score = chroma * (1 - Math.abs((max + min) / 2 / 255 - 0.55));
          if (score > bestScore) { bestScore = score; best = [r, g, b]; }
        }
        if (!n) return null;

        var average = [sum[0] / n, sum[1] / n, sum[2] / n];
        var hue = bestScore > 12 ? best : average;
        return {
          glow: rgb(scale(hue, .30)),
          soft: rgb(scale(average, .17)),
          accent: rgb(lift(hue))
        };
      } catch (e) {
        return null;
      }
    }

    function scale(c, f) { return [c[0] * f, c[1] * f, c[2] * f]; }

    function lift(c) {
      var max = Math.max(c[0], c[1], c[2]) || 1;
      var f = Math.min(2.6, 205 / max);
      return [Math.min(255, c[0] * f), Math.min(255, c[1] * f), Math.min(255, c[2] * f)];
    }

    function rgb(c) {
      return 'rgb(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ')';
    }

    function applyPalette(p) {
      var root = document.documentElement.style;
      if (!p) {
        root.setProperty('--glow', '#2A2118');
        root.setProperty('--glow-soft', '#1A1611');
        root.setProperty('--accent', '#C9BFAE');
        return;
      }
      root.setProperty('--glow', p.glow);
      root.setProperty('--glow-soft', p.soft);
      root.setProperty('--accent', p.accent);
    }

    var coverRequest = 0;

    function setCover(url) {
      if (url === shown.cover) return;
      shown.cover = url || '';

      var mine = ++coverRequest;

      if (!url) {
        el.cover.removeAttribute('src');
        el.wash.style.backgroundImage = '';
        el.art.classList.add('empty');
        el.body.classList.remove('has-cover');
        applyPalette(null);
        return;
      }

      if (!/^https?:\/\//i.test(url)) {
        el.art.classList.add('empty');
        el.body.classList.remove('has-cover');
        applyPalette(null);
        return;
      }

      var img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = function () {
        if (mine !== coverRequest) return;
        el.cover.src = url;
        el.wash.style.backgroundImage = 'url("' + encodeURI(url) + '")';
        el.art.classList.remove('empty');
        el.body.classList.add('has-cover');
        applyPalette(paletteFrom(img));
      };
      img.onerror = function () {
        if (mine !== coverRequest) return;
        el.art.classList.add('empty');
        el.body.classList.remove('has-cover');
        applyPalette(null);
      };
      img.src = url;
    }

    function albumWorthPrinting() {
      var album = (shown.album || '').trim();
      if (!album) return '';

      var plain = function (s) { return (s || '').trim().toLowerCase(); };
      if (plain(album) === plain(shown.title) || plain(album) === plain(shown.artist)) return '';
      return album;
    }

    function text(node, value) {
      var next = value || '';
      if (node.textContent !== next) node.textContent = next;
      return next;
    }

    function render(update, isNewTrack) {
      if (isNewTrack) {
        shown = { title: '', artist: '', album: '', cover: '', quality: '', zone: shown.zone };
        duration = 0; position = 0; positionAt = Date.now();
      }

      ['title', 'artist', 'album', 'quality', 'zone'].forEach(function (key) {
        if (update[key]) shown[key] = update[key];
      });

      text(el.title, shown.title || 'KlangHub');
      text(el.artist, shown.artist);
      text(el.album, albumWorthPrinting());
      text(el.quality, shown.quality);
      text(el.zone, shown.zone);

      el.body.classList.toggle('has-quality', !!shown.quality);
      el.body.classList.remove('idle');

      if (isNewTrack) setCover(update.cover || '');
      else if (update.cover !== undefined) setCover(update.cover);

      if (isNewTrack) duration = typeof update.duration === 'number' ? update.duration : 0;
      else if (typeof update.duration === 'number') duration = update.duration;
      if (typeof update.position === 'number') { position = update.position; positionAt = Date.now(); }
      el.body.classList.toggle('has-progress', duration > 0);
    }

    var CUT_MS = 520;
    var pending = null;

    function change(update) {
      settle();

      if (!shown.cover && !update.cover) { render(update, true); return; }

      pending = { update: update, due: nowMs() + CUT_MS, timer: 0 };
      el.body.classList.add('changing');
      pending.timer = setTimeout(settle, CUT_MS);
      requestAnimationFrame(awaitCut);
    }

    function awaitCut() {
      if (!pending) return;
      if (nowMs() >= pending.due) { settle(); return; }
      requestAnimationFrame(awaitCut);
    }

    function settle() {
      if (!pending) return;

      var landing = pending;
      pending = null;
      if (landing.timer) clearTimeout(landing.timer);

      render(landing.update, true);
      el.body.classList.remove('changing');
    }

    function settleIfOverdue() {
      if (pending && nowMs() >= pending.due) settle();
    }

    function clock(seconds) {
      if (!(seconds >= 0)) return '';
      var s = Math.floor(seconds % 60), m = Math.floor(seconds / 60) % 60, h = Math.floor(seconds / 3600);
      var mm = h ? (m < 10 ? '0' + m : '' + m) : '' + m;
      return (h ? h + ':' : '') + mm + ':' + (s < 10 ? '0' + s : s);
    }

    function tick() {
      if (duration > 0) {
        var at = position + (playing ? (Date.now() - positionAt) / 1000 : 0);
        if (at > duration) at = duration;
        var pct = (at / duration) * 100;
        el.elapsed.style.width = pct + '%';
        el.head.style.left = pct + '%';
        text(el.now, clock(at));
        text(el.total, clock(duration));
      }

      var d = new Date();
      text(el.clock, d.getHours() + ':' + (d.getMinutes() < 10 ? '0' : '') + d.getMinutes());
    }
    setInterval(tick, 1000);
    tick();

    function fromMedia(media) {
      var m = (media && media.metadata) || {};
      var images = m.images || [];
      return {
        title: m.title || '',
        artist: m.artist || '',
        album: m.albumName || '',
        cover: images.length ? images[0].url : '',
        quality: describeFormat(media && media.contentType)
      };
    }

    function describeFormat(contentType) {
      if (!contentType) return '';
      if (contentType.indexOf('mpeg') >= 0) return 'MP3';
      if (contentType.indexOf('flac') >= 0) return 'FLAC';
      if (contentType.indexOf('wav') >= 0) return 'WAV';
      return '';
    }

    if (window.cast && window.cast.framework) {
      var context = cast.framework.CastReceiverContext.getInstance();
      var playerManager = context.getPlayerManager();

      var loadedMedia = null;

      function mediaWorthShowing(preferred) {
        if (preferred && preferred.metadata) return preferred;
        try {
          var asked = playerManager.getMediaInformation();
          if (asked && asked.metadata) return asked;
        } catch (e) {}
        return loadedMedia || preferred;
      }

      playerManager.setMessageInterceptor(cast.framework.messages.MessageType.LOAD, function (request) {
        var media = request && request.media;
        if (media) loadedMedia = media;
        rememberToken((media && media.customData) || (request && request.customData));
        return request;
      });

      playerManager.addEventListener(cast.framework.events.EventType.LOAD_START, function (event) {
        if (!sessionToken) rememberToken(event.media && event.media.customData);
        change(fromMedia(mediaWorthShowing(event.media)));
      });

      playerManager.addEventListener(cast.framework.events.EventType.PLAYING, function () {
        playing = true;
        el.body.classList.remove('paused', 'idle');
      });

      playerManager.addEventListener(cast.framework.events.EventType.PAUSE, function () {
        playing = false;
        positionAt = Date.now();
        el.body.classList.add('paused');
      });

      [cast.framework.events.EventType.MEDIA_FINISHED,
       cast.framework.events.EventType.ERROR].forEach(function (type) {
        playerManager.addEventListener(type, function () {
          playing = false;
          el.body.classList.add('idle');
          el.body.classList.remove('paused');
          setCover('');
        });
      });

      context.addCustomMessageListener(NAMESPACE, function (event) {
        var d = event.data || {};
        if (!fromUs(d)) return;

        settleIfOverdue();

        if (d.type === 'track') {
          d.newTrack ? change(d) : render(d, false);
        } else if (d.type === 'position') {
          render({ position: d.position, duration: d.duration }, false);
        } else if (d.type === 'state') {
          playing = d.playing;
          el.body.classList.toggle('paused', !d.playing);
        }
      });

      var options = new cast.framework.CastReceiverOptions();
      options.customNamespaces = {};
      options.customNamespaces[NAMESPACE] = cast.framework.system.MessageType.JSON;
      options.disableIdleTimeout = false;
      context.start(options);
    } else {
      var demo = (location.search.match(/demo=(\w+)/) || [])[1];
      el.body.classList.remove('idle');
      playing = true;
      render({
        title: 'Teardrop',
        artist: 'Massive Attack',
        album: 'Mezzanine',
        quality: 'FLAC · 24 Bit · 96 kHz',
        zone: 'Wohnzimmer + Küche',
        duration: 330,
        position: 134
      }, true);
      positionAt = Date.now();
      demoShowCover();

      if (demo === 'radio') {
        render({
          title: 'Broken Nights',
          artist: 'Patiotic',
          zone: 'Wohnzimmer + Küche'
        }, true);
      }

      if (demo === 'paused') { playing = false; el.body.classList.add('paused'); }
      if (demo === 'idle') { playing = false; el.body.classList.add('idle'); setCover(''); }
      tick();
    }

    function demoShowCover() {
      var url = demoCover();
      shown.cover = url;
      el.cover.src = url;
      el.wash.style.backgroundImage = 'url("' + url + '")';
      el.art.classList.remove('empty');
      el.body.classList.add('has-cover');
      var img = new Image();
      img.onload = function () { applyPalette(paletteFrom(img)); };
      img.src = url;
    }

    function demoCover() {
      var c = document.createElement('canvas');
      c.width = c.height = 600;
      var x = c.getContext('2d');
      var g = x.createLinearGradient(0, 0, 600, 600);
      g.addColorStop(0, '#1B2A3A'); g.addColorStop(.55, '#2E4A5E'); g.addColorStop(1, '#0C1218');
      x.fillStyle = g; x.fillRect(0, 0, 600, 600);
      x.strokeStyle = 'rgba(215,190,150,.5)';
      for (var i = 1; i <= 5; i++) {
        x.lineWidth = 1.5;
        x.beginPath(); x.arc(300, 300, i * 46, 0, Math.PI * 2); x.stroke();
      }
      x.fillStyle = 'rgba(232,182,90,.9)';
      x.beginPath(); x.arc(300, 300, 22, 0, Math.PI * 2); x.fill();
      return c.toDataURL();
    }
  })();
  </script>
</body>
