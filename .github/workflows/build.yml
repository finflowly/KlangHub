name: Build

# WinForms plus the Windows Now-Playing API: this only builds on Windows.
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          # Every project targets net10.0 / net10.0-windows10.0.19041.0.
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build Source/KlangHub.sln -c Release

      - name: Test
        run: dotnet test Source/KlangHub.Tests/KlangHub.Tests.csproj -c Release --no-build
